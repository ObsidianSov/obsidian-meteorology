// ===== rainfall_onset.js (inlined by build.js: edit the module file, not this copy) =====
// Rainfall onset detection and year-over-year variability analysis
// Pure functions — no network, testable in isolation
//
// Method: Sivakumar (1988), Agricultural and Forest Meteorology 42(4):295-305, as described in
// later West African studies. Onset = the first date, from 1 May, on which
//   - at least 20 mm of rain falls over 3 consecutive days, AND
//   - no dry sequence longer than 7 days occurs in the following 30 days
//     (this filters out "false starts": early rain that does not sustain the season).
// Implementation choices NOT fixed by the criterion (see docs/onset-method.md):
//   - a dry day is a day under 1.0 mm
//   - the onset date is the first wet day (>= 1.0 mm) of the triggering 3-day window
//   - the 30-day check starts the day after the 3-day window
//   - missing days are never treated as dry or wet (see detectOnsetDetailed)

function dateStringToDayOfYear(dateStr) {
  // dateStr format: "YYYYMMDD" (as returned by NASA POWER)
  const year = parseInt(dateStr.substring(0, 4));
  const month = parseInt(dateStr.substring(4, 6));
  const day = parseInt(dateStr.substring(6, 8));
  const date = Date.UTC(year, month - 1, day);
  const startOfYear = Date.UTC(year, 0, 1);
  return Math.round((date - startOfYear) / 86400000) + 1; // 1-indexed
}

function dayOfYearToDateString(year, dayOfYear) {
  const date = new Date(Date.UTC(year, 0, 1));
  date.setUTCDate(date.getUTCDate() + dayOfYear - 1);
  const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(date.getUTCDate()).padStart(2, '0');
  return `${date.getUTCFullYear()}-${mm}-${dd}`;
}

function formatDayOfYear(dayOfYear) {
  // "1 May" style label for a day-of-year. Uses a non-leap reference year, so in leap years the
  // label for days after 28 February is one day later than the real date (documented limit).
  const iso = dayOfYearToDateString(2021, Math.round(dayOfYear));
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${parseInt(iso.slice(8, 10), 10)} ${months[parseInt(iso.slice(5, 7), 10) - 1]}`;
}

function groupDailyByYear(dailySeries) {
  // dailySeries: output of parseNasaPowerSeries — [{date, year, value}]
  const byYear = {};
  for (const d of dailySeries) {
    if (!byYear[d.year]) byYear[d.year] = [];
    byYear[d.year].push({ dayOfYear: dateStringToDayOfYear(d.date), value: d.value });
  }
  for (const year in byYear) {
    byYear[year].sort((a, b) => a.dayOfYear - b.dayOfYear);
  }
  return byYear;
}

function detectOnsetDetailed(yearDays, options = {}) {
  // Returns { day, status } where status is:
  //   'detected'          a valid onset was found and confirmed
  //   'none'              data cover the core rainy season (through 30 Sep) and no valid onset exists
  //   'insufficient_data' missing days stop us from confirming the answer
  // Missing days (days absent from yearDays) are NEVER treated as dry or as zero rain.
  const {
    startDayOfYear = 121,     // 1 May in a non-leap year (computeOnsetDatesAllYears sets the exact day per year)
    thresholdMM = 20,         // cumulative rain needed in window to trigger a candidate
    windowDays = 3,
    dryspellCheckDays = 30,   // how far ahead to check for a false start
    maxDrySpellDays = 7,      // a dry sequence LONGER than this in the check window = false start
    dryDayThreshold = 1.0,    // mm below which a day counts as "dry"
    completeThroughDay = 273  // 'none' is only claimed if data reach this day (30 Sep in a non-leap year)
  } = options;

  const valueByDay = {};
  for (const d of yearDays) valueByDay[d.dayOfYear] = d.value;
  const maxDay = yearDays.length ? yearDays[yearDays.length - 1].dayOfYear : 0;

  let unknownWindowBefore = false; // a window with missing days that might have been the true onset

  for (let start = startDayOfYear; start <= maxDay - windowDays + 1; start++) {
    let windowSum = 0, missingInWindow = 0;
    for (let k = 0; k < windowDays; k++) {
      const v = valueByDay[start + k];
      if (v === undefined) missingInWindow++; else windowSum += v;
    }
    if (windowSum < thresholdMM) {
      // With missing days we cannot rule this window out as the true onset
      if (missingInWindow > 0) unknownWindowBefore = true;
      continue;
    }
    // windowSum is a lower bound, so reaching the threshold is certain even with missing days.

    const checkStart = start + windowDays;
    const checkEnd = checkStart + dryspellCheckDays - 1; // days past the data count as missing
    let confirmedRun = 0, confirmedLongest = 0, possibleRun = 0, possibleLongest = 0;
    for (let day = checkStart; day <= checkEnd; day++) {
      const v = valueByDay[day];
      const missing = v === undefined;
      const dry = !missing && v < dryDayThreshold;
      if (dry) { confirmedRun++; confirmedLongest = Math.max(confirmedLongest, confirmedRun); } else confirmedRun = 0;
      if (dry || missing) { possibleRun++; possibleLongest = Math.max(possibleLongest, possibleRun); } else possibleRun = 0;
    }
    if (confirmedLongest > maxDrySpellDays) continue;           // confirmed false start
    if (possibleLongest > maxDrySpellDays) return { day: null, status: 'insufficient_data' }; // cannot confirm
    if (unknownWindowBefore) return { day: null, status: 'insufficient_data' };               // cannot confirm it is the first
    // Onset date: the first wet day of the triggering window (a window can begin on a dry day)
    let onsetDay = start;
    for (let k = 0; k < windowDays; k++) {
      const v = valueByDay[start + k];
      if (v !== undefined && v >= dryDayThreshold) { onsetDay = start + k; break; }
    }
    return { day: onsetDay, status: 'detected' };
  }
  // No onset found. We may only say 'none' if the data cover the core rainy season; a year that
  // ends early (for example the current year) simply has not been observed long enough.
  const seasonObserved = maxDay >= completeThroughDay;
  return { day: null, status: (unknownWindowBefore || !seasonObserved) ? 'insufficient_data' : 'none' };
}

function detectOnsetForYear(yearDays, options = {}) {
  // Convenience wrapper: the onset day-of-year, or null if there is none / it cannot be confirmed.
  return detectOnsetDetailed(yearDays, options).day;
}

function computeOnsetDatesAllYears(dailySeries, options = {}, years = null) {
  // years (optional): every year in this list gets a result, even if it has no data at all.
  const byYear = groupDailyByYear(dailySeries);
  const yearList = years ? years : Object.keys(byYear).map(y => parseInt(y));
  return yearList
    .map(year => {
      const days = byYear[year] || [];
      const yearOptions = { ...options };
      if (yearOptions.startDayOfYear === undefined) yearOptions.startDayOfYear = dateStringToDayOfYear(`${year}0501`); // 1 May, leap-safe
      if (yearOptions.completeThroughDay === undefined) yearOptions.completeThroughDay = dateStringToDayOfYear(`${year}0930`); // 30 Sep, leap-safe
      const detail = days.length ? detectOnsetDetailed(days, yearOptions) : { day: null, status: 'insufficient_data' };
      return {
        year,
        onsetDayOfYear: detail.day,
        onsetDate: detail.day ? dayOfYearToDateString(year, detail.day) : null,
        status: detail.status
      };
    })
    .sort((a, b) => a.year - b.year);
}

function coefficientOfVariation(values) {
  const n = values.length;
  if (n === 0) return { mean: 0, stdDev: 0, cv: 0 };
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const variance = values.reduce((sum, v) => sum + (v - mean) ** 2, 0) / n;
  const stdDev = Math.sqrt(variance);
  const cv = mean === 0 ? 0 : (stdDev / mean) * 100;
  return {
    mean: Math.round(mean * 100) / 100,
    stdDev: Math.round(stdDev * 100) / 100,
    cv: Math.round(cv * 100) / 100
  };
}

function onsetVariability(onsetResults) {
  const validOnsets = onsetResults.filter(r => r.onsetDayOfYear !== null).map(r => r.onsetDayOfYear);
  const stats = coefficientOfVariation(validOnsets);
  const missingYears = onsetResults.filter(r => r.onsetDayOfYear === null).map(r => r.year);
  const insufficientYears = onsetResults.filter(r => r.status === 'insufficient_data').map(r => r.year);
  const noOnsetYears = onsetResults.filter(r => r.onsetDayOfYear === null && r.status !== 'insufficient_data').map(r => r.year);
  return {
    ...stats,
    yearsWithValidOnset: validOnsets.length,
    yearsTotal: onsetResults.length,
    missingYears,        // all years without an onset, for any reason
    insufficientYears,   // subset: missing data prevented a decision
    noOnsetYears         // subset: data adequate, no valid onset found
  };
}

if (typeof module !== "undefined") module.exports = {
  dateStringToDayOfYear,
  dayOfYearToDateString,
  formatDayOfYear,
  groupDailyByYear,
  detectOnsetDetailed,
  detectOnsetForYear,
  computeOnsetDatesAllYears,
  coefficientOfVariation,
  onsetVariability
};
</script>
<script>
// Knowledge layer (KNOWLEDGE_BASE, getExplanation, getVariableInfo) lives in knowledge_layer.js

const WEATHER_CODES = {
  0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Depositing rime fog",
  51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
  61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
  80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
  95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with heavy hail"
};

let currentTier = "student";
let latestData = null;

async function loadWeather(lat, lon) {
  const content = document.getElementById("content");
  content.innerHTML = '<div class="status">Loading live data...</div>';

  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,precipitation,weather_code,surface_pressure` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,wind_speed_10m_max,uv_index_max` +
    `&timezone=Africa%2FLagos`;

  try {
    const data = await fetchJsonWithRetry(url, {
      label: "Open-Meteo", timeoutMs: 20000,
      onRetry: (n) => { content.innerHTML = `<div class="status">Open-Meteo did not answer properly. Trying again (${n} of 2)...</div>`; }
    });
    const live = readLiveResponse(data);
    if (!live.ok) throw new Error(live.error);
    latestData = { current: live.current, daily: live.daily, missingCount: live.missingCount, fetchedAt: new Date() };
    render();
  } catch (err) {
    content.innerHTML = `<div class="error">
      Could not load live weather data: ${escapeHtml(err.message)}.<br>
      Check your internet connection and try again — this prototype requires
      a live connection to Open-Meteo's free API.
    </div>`;
  }
}

function render() {
  if (!latestData) return;
  if (currentTier === "student") renderStudent();
  else if (currentTier === "advanced") renderAdvanced();
  else renderNimet();
}

function liveSourceCard() {
  // Says what the numbers are: model values, for which time, fetched when. Never "station readings".
  const d = latestData;
  const src = DATA_SOURCES.open_meteo_forecast;
  return `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Data source</div>
      <div class="explain">
        ${src.name}: ${src.typeLabel}. Values for ${d.current.time || "the latest model time"} (Lagos time),
        fetched ${d.fetchedAt.toLocaleTimeString()}.
        ${d.missingCount ? `<strong>${d.missingCount} value${d.missingCount === 1 ? " was" : "s were"} not provided by the service and show${d.missingCount === 1 ? "s" : ""} as n/a.</strong>` : ""}
      </div>
    </div>`;
}

function conditionText(code, unknownText) {
  if (code === null) return unknownText;
  return WEATHER_CODES[code] || unknownText;
}

function renderStudent() {
  const d = latestData;
  const c = d.current;
  const daily = d.daily;
  const code = conditionText(c.weather_code, "Conditions not available");
  const nDays = Math.min(7, daily.time.length);

  let forecastHtml = "";
  for (let i = 0; i < nDays; i++) {
    const date = new Date(daily.time[i]);
    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
    forecastHtml += `
      <div class="day-card">
        <div class="day-name">${dayName}</div>
        <div class="day-temp">${fmt(daily.temperature_2m_max[i], 0, "°")}/${fmt(daily.temperature_2m_min[i], 0, "°")}</div>
        <div class="day-rain">${fmt(daily.precipitation_sum[i], 1, "mm")}</div>
      </div>`;
  }
  if (nDays === 0) forecastHtml = '<div class="explain">No forecast days were provided.</div>';

  document.getElementById("content").innerHTML = `
    ${liveSourceCard()}
    <div class="grid">
      <div class="card">
        <div class="card-label">Right now (model estimate)</div>
        <div class="card-value">${fmt(c.temperature_2m, 0, "°C")}</div>
        <div class="card-sub">${code}</div>
        <div class="explain">Feels like ${fmt(c.apparent_temperature, 0, "°C")} — ${getExplanation('apparentTemperature', 'student')}</div>
      </div>
      <div class="card">
        <div class="card-label">Humidity</div>
        <div class="card-value">${fmt(c.relative_humidity_2m, 0, "%")}</div>
        <div class="explain">${getExplanation('humidity', 'student')}</div>
      </div>
      <div class="card">
        <div class="card-label">Wind</div>
        <div class="card-value">${fmt(c.wind_speed_10m, 0, " km/h")}</div>
        <div class="explain">${getExplanation('windSpeed', 'student')}</div>
      </div>
      <div class="card">
        <div class="card-label">Rain expected today</div>
        <div class="card-value">${fmt(daily.precipitation_sum[0], 1, " mm")}</div>
        <div class="card-sub">Model forecast total for the day</div>
        <div class="explain">${getExplanation('precipitation', 'student')}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">7-Day Outlook (forecast)</div>
      <div class="forecast-row">${forecastHtml}</div>
    </div>
  `;
}

function renderAdvanced() {
  const d = latestData;
  const c = d.current;
  const daily = d.daily;

  let rows = "";
  for (let i = 0; i < Math.min(7, daily.time.length); i++) {
    const code = daily.weather_code[i];
    rows += `<tr>
      <td>${daily.time[i]}</td>
      <td>${showRaw(daily.temperature_2m_max[i])}</td>
      <td>${showRaw(daily.temperature_2m_min[i])}</td>
      <td>${showRaw(daily.precipitation_sum[i])}</td>
      <td>${showRaw(daily.wind_speed_10m_max[i])}</td>
      <td>${showRaw(daily.uv_index_max[i])}</td>
      <td>${code === null ? "n/a" : (WEATHER_CODES[code] || code)}</td>
    </tr>`;
  }

  document.getElementById("content").innerHTML = `
    ${liveSourceCard()}
    <div class="grid">
      <div class="card">
        <div class="card-label">temperature_2m</div>
        <div class="card-value">${fmt(c.temperature_2m, 1, "°C")}</div>
      </div>
      <div class="card">
        <div class="card-label">apparent_temperature</div>
        <div class="card-value">${fmt(c.apparent_temperature, 1, "°C")}</div>
      </div>
      <div class="card">
        <div class="card-label">relative_humidity_2m</div>
        <div class="card-value">${fmt(c.relative_humidity_2m, 0, "%")}</div>
      </div>
      <div class="card">
        <div class="card-label">surface_pressure</div>
        <div class="card-value">${fmt(c.surface_pressure, 1, " hPa")}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Daily aggregates (raw model forecast)</div>
      <table class="advanced-table">
        <tr><th>Date</th><th>T-max °C</th><th>T-min °C</th><th>Precip mm</th><th>Wind max km/h</th><th>UV max</th><th>Code</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

function renderNimet() {
  const d = latestData;
  const c = d.current;
  const daily = d.daily;
  const code = conditionText(c.weather_code, "N/A");

  document.getElementById("content").innerHTML = `
    ${liveSourceCard()}
    <div class="grid">
      <div class="card">
        <div class="card-label">Model value — Current (not a station reading)</div>
        <div class="card-value">${fmt(c.temperature_2m, 1, "°C")}</div>
        <div class="card-sub">Condition: ${code} | Pressure: ${fmt(c.surface_pressure, 1, " hPa")}</div>
      </div>
      <div class="card">
        <div class="card-label">Wind (model, 10 m above ground)</div>
        <div class="card-value">${fmt(c.wind_speed_10m, 1, " km/h")}</div>
        <div class="card-sub">Model estimate at 10 m, not an anemometer reading</div>
      </div>
      <div class="card">
        <div class="card-label">Precipitation (latest model interval)</div>
        <div class="card-value">${fmt(c.precipitation, 1, " mm")}</div>
        <div class="card-sub">Not a 24-hour total</div>
      </div>
      <div class="card">
        <div class="card-label">Relative Humidity</div>
        <div class="card-value">${fmt(c.relative_humidity_2m, 0, "%")}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">7-Day Synoptic Summary (model forecast)</div>
      <table class="advanced-table">
        <tr><th>Date</th><th>Tmax</th><th>Tmin</th><th>Precip Sum</th><th>Max Wind</th><th>UV Index</th></tr>
        ${daily.time.slice(0, 7).map((t, i) => `<tr>
          <td>${t}</td><td>${fmt(daily.temperature_2m_max[i], 1, "°C")}</td><td>${fmt(daily.temperature_2m_min[i], 1, "°C")}</td>
          <td>${fmt(daily.precipitation_sum[i], 1, "mm")}</td><td>${fmt(daily.wind_speed_10m_max[i], 1, "km/h")}</td>
          <td>${fmt(daily.uv_index_max[i], 1)}</td>
        </tr>`).join("")}
      </table>
    </div>
  `;
}

document.querySelectorAll("[data-tier]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-tier]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTier = btn.dataset.tier;
    render();
    if (document.getElementById("historical-content").style.display !== "none" &&
        document.getElementById("historical-results").innerHTML.trim() !== "") {
      showHistorical();
    }
  });
});

document.getElementById("locationSelect").addEventListener("change", (e) => {
  const [lat, lon] = e.target.value.split(",");
  loadWeather(lat, lon);
});

// Historical climate maths (climate_math.js) and rainfall onset (rainfall_onset.js) are loaded as modules above.

let rainChart = null;
let tempChart = null;
let onsetChart = null;
let historicalState = null;

function browserStorage() {
  // Some browsers block storage for local files; then the saved copies live in memory only.
  try { const s = window.localStorage; s.setItem("om-test", "1"); s.removeItem("om-test"); return s; } catch (e) { return null; }
}
const dataCache = createCache(browserStorage());   // the loaded data, kept in memory so switching views does not download it again

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function historicalKey() {
  return [document.getElementById("locationSelect").value, document.getElementById("histStartYear").value, document.getElementById("histEndYear").value].join("|");
}

function showHistorical() {
  // Re-draw from memory when the same data is already loaded; otherwise fetch.
  if (historicalState && historicalState.key === historicalKey()) renderHistorical(...historicalState.args);
  else loadHistorical();
}

// The latest selectable year is the last complete calendar year (updates itself every year)
(function setYearLimits() {
  const lastCompleteYear = new Date().getFullYear() - 1;
  for (const id of ["histStartYear", "histEndYear"]) document.getElementById(id).max = lastCompleteYear;
})();

async function loadHistorical(forceRefresh = false) {
  const resultsDiv = document.getElementById("historical-results");
  const startYear = document.getElementById("histStartYear").value;
  const endYear = document.getElementById("histEndYear").value;
  const [lat, lon] = document.getElementById("locationSelect").value.split(",");

  resultsDiv.innerHTML = '<div class="status">Fetching historical data from NASA POWER (this can take a few seconds for long ranges)...</div>';

  const url = `https://power.larc.nasa.gov/api/temporal/daily/point?` +
    `latitude=${lat}&longitude=${lon}` +
    `&start=${startYear}0101&end=${endYear}1231` +
    `&parameters=T2M,PRECTOTCORR&community=AG&format=JSON`;

  try {
    const got = await getJsonCached(url, {
      cache: dataCache, maxAgeMs: DEFAULT_MAX_AGE_MS, force: forceRefresh === true,
      fetchJson: (u) => fetchJsonWithRetry(u, {
        label: "NASA POWER", timeoutMs: 60000,
        onRetry: (n) => { resultsDiv.innerHTML = `<div class="status">NASA POWER did not answer properly. Trying again (${n} of 2)...</div>`; }
      }),
      validate: (d) => {
        const p = d && d.properties && d.properties.parameter;
        if (!p || !p.T2M || !p.PRECTOTCORR) throw new Error("NASA POWER returned an answer without the expected data");
      }
    });
    const data = got.data;

    const rawTemp = data.properties.parameter.T2M;
    const rawPrecip = data.properties.parameter.PRECTOTCORR;

    const dailyTemp = parseNasaPowerSeries(rawTemp);
    const dailyPrecip = parseNasaPowerSeries(rawPrecip);

    const startY = parseInt(startYear), endY = parseInt(endYear);
    if (!(startY <= endY)) throw new Error("the start year must not be after the end year");

    // Only years with enough valid days are used. Missing days are never filled with zeros.
    const rainSel = selectCompleteYears(aggregateAnnualRainfall(dailyPrecip), startY, endY);
    const tempSel = selectCompleteYears(aggregateAnnualMeanTemp(dailyTemp), startY, endY);
    const annualRain = rainSel.eligible;
    const annualTemp = tempSel.eligible;
    if (annualRain.length < 3 || annualTemp.length < 3) {
      throw new Error(`fewer than 3 years have enough valid data (rainfall ${annualRain.length}, temperature ${annualTemp.length}) — choose a different year range`);
    }

    const rainTrend = analyzeTrend(annualRain.map(y => ({ year: y.year, value: y.total })));
    const tempTrend = analyzeTrend(annualTemp.map(y => ({ year: y.year, value: y.mean })));

    const wettestYear = findExtremeYear(annualRain, 'total', 'max');
    const driestYear = findExtremeYear(annualRain, 'total', 'min');
    const hottestYear = findExtremeYear(annualTemp, 'mean', 'max');
    const coldestYear = findExtremeYear(annualTemp, 'mean', 'min');

    const yearsInRange = [];
    for (let y = startY; y <= endY; y++) yearsInRange.push(y);
    const onsetResults = computeOnsetDatesAllYears(dailyPrecip, {}, yearsInRange);
    const onsetStats = onsetVariability(onsetResults);
    const validOnsetPoints = onsetResults
      .filter(r => r.onsetDayOfYear !== null)
      .map(r => ({ year: r.year, value: r.onsetDayOfYear }));
    const onsetTrend = analyzeTrend(validOnsetPoints);

    historicalState = {
      key: historicalKey(), lat, lon, startY, endY, retrievedAt: new Date(got.savedAt), fromCache: got.fromCache,
      forceCompare: forceRefresh === true, compareAttempted: false, rainSel, tempSel, comparison: null,
      args: [annualRain, annualTemp, rainTrend, tempTrend, wettestYear, driestYear, hottestYear, coldestYear,
             onsetResults, onsetStats, onsetTrend, rainSel, tempSel]
    };
    renderHistorical(...historicalState.args);

  } catch (err) {
    historicalState = null;
    resultsDiv.innerHTML = `<div class="error">
      Could not load historical data: ${escapeHtml(err.message)}.<br>
      NASA POWER can be slow or briefly unavailable — try a smaller year range or try again shortly.
    </div>`;
  }
}

function renderHistorical(annualRain, annualTemp, rainTrend, tempTrend,
                           wettestYear, driestYear, hottestYear, coldestYear,
                           onsetResults, onsetStats, onsetTrend, rainSel, tempSel) {
  const resultsDiv = document.getElementById("historical-results");

  const describeExcluded = (sel) => sel.excluded.length
    ? sel.excluded.map(e => `${e.year} (${Math.round(e.coverage * 100)}% of days)`).join(", ")
    : "none";
  const minPct = Math.round(rainSel.minCoverage * 100);
  const completenessCard = `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Data completeness</div>
      <div class="explain">
        Rainfall: <strong>${rainSel.eligible.length}</strong> of ${rainSel.eligible.length + rainSel.excluded.length} years used
        (a year needs at least ${minPct}% valid days). Left out: ${describeExcluded(rainSel)}.<br>
        Temperature: <strong>${tempSel.eligible.length}</strong> of ${tempSel.eligible.length + tempSel.excluded.length} years used.
        Left out: ${describeExcluded(tempSel)}.<br>
        Missing days are never replaced by zeros; years with too many missing days are left out of totals, trends and records.
      </div>
    </div>`;
  const retrievedText = historicalState
    ? `retrieved ${historicalState.retrievedAt.toLocaleString()}${historicalState.fromCache ? `, saved copy ${describeAge(Date.now() - historicalState.retrievedAt.getTime())} old` : ""}`
    : "retrieved just now";
  const dataNoteCard = `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">About this data</div>
      <div class="explain">
        Historical values are ${DATA_SOURCES.nasa_power.name} daily estimates for the chosen coordinates
        (${retrievedText}).
        ${DATA_SOURCES.nasa_power.typeLabel.replace(" for the chosen coordinates", "")}. ${DATA_SOURCES.nasa_power.origin} Trends use the Mann-Kendall test with
        Sen's slope at the 5% level, and a trend is only reported when the test supports it and at least
        ${MIN_YEARS_FOR_TREND} years are usable.
      </div>
      ${historicalState && historicalState.fromCache ? '<button id="refreshBtn" class="tier-btn" style="margin-top:8px;">Download a fresh copy</button>' : ""}
    </div>`;
  const secondSourceCard = `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Second source check</div>
      <div class="explain">
        These results are checked automatically against ${DATA_SOURCES.era5_open_meteo.name}: a different reanalysis.
        Agreement between two sources makes a result more trustworthy; disagreement is a warning.
      </div>
      <button id="compareBtn" class="tier-btn" style="margin-top:8px; background:var(--cyan); color:#0a0e17;">Check again with a fresh download</button>
      <div id="compareResult" style="margin-top:10px;"></div>
    </div>`;
  const insufficientNote = onsetStats.insufficientYears.length
    ? `${onsetStats.insufficientYears.length} year(s) (${onsetStats.insufficientYears.join(", ")}) had too much missing data to decide the onset.`
    : "";


  const validOnsetResults = onsetResults.filter(r => r.onsetDayOfYear !== null);
  const earliestOnset = validOnsetResults.length
    ? validOnsetResults.reduce((a, b) => a.onsetDayOfYear < b.onsetDayOfYear ? a : b) : null;
  const latestOnset = validOnsetResults.length
    ? validOnsetResults.reduce((a, b) => a.onsetDayOfYear > b.onsetDayOfYear ? a : b) : null;

  const verdictLabel = (t) => ({ increasing: "significant increase", decreasing: "significant decrease", none: "no significant trend", too_few: "too few years to test" })[t.verdict];
  const senText = (t, digits, unit) => (t.verdict === "too_few" || t.slope === null) ? "n/a"
    : `${signedNumber(t.slope, digits)} ${unit} (${signedNumber(t.slopeLow, digits)} to ${signedNumber(t.slopeHigh, digits)})`;
  const mkText = (t) => (t.verdict === "too_few" || t.p === null) ? "n/a" : `Z = ${t.z.toFixed(2)}, ${formatPValue(t.p)}`;
  const regRain = linearRegression(annualRain.map(y => ({ year: y.year, value: y.total })));
  const regTemp = linearRegression(annualTemp.map(y => ({ year: y.year, value: y.mean })));
  const rainSens = trendSensitivity(annualRain.map(y => ({ year: y.year, value: y.total })));
  const tempSens = trendSensitivity(annualTemp.map(y => ({ year: y.year, value: y.mean })));
  const onsetSens = trendSensitivity(validOnsetResults.map(r => ({ year: r.year, value: r.onsetDayOfYear })));
  const sensBlock = (text) => text ? `<div class="explain" style="border-left-color:#f5a623;">${text}</div>` : "";
  const rainSensText = describeSensitivity(rainSens, { unit: "mm", digits: 1 });
  const tempSensText = describeSensitivity(tempSens, { unit: "°C", digits: 1, upPhrase: "warming trend", downPhrase: "cooling trend" });
  const onsetSensText = describeSensitivity(onsetSens, { unit: "day of year", digits: 0, upPhrase: "trend towards later onset", downPhrase: "trend towards earlier onset" });
  const flaggedList = (s) => s.flagged.length ? s.flagged.map(f => f.year).join(", ") : "none";
  const withoutVerdict = (s) => s.without ? verdictLabel(s.without) : "n/a";
  const meanOnsetLabel = onsetStats.yearsWithValidOnset > 0 ? formatDayOfYear(onsetStats.mean) : "n/a";

  let studentSummary = `
    <div class="explain">
      ${describeTrend(rainTrend, { label: "annual rainfall", unit: "mm", digits: 1 })}
      The wettest year in this dataset was <strong>${wettestYear.year}</strong>
      (${wettestYear.total} mm), and the driest was <strong>${driestYear.year}</strong>
      (${driestYear.total} mm).
    </div>
    ${sensBlock(rainSensText)}
    <div id="rainDispute"></div>
    <div class="explain">
      ${describeTrend(tempTrend, { label: "annual mean temperature", unit: "°C", digits: 3, upPhrase: "warming trend", downPhrase: "cooling trend" })}
      The hottest year on average was <strong>${hottestYear.year}</strong> (${hottestYear.mean}°C),
      the coolest was <strong>${coldestYear.year}</strong> (${coldestYear.mean}°C).
    </div>
    ${sensBlock(tempSensText)}
    <div id="tempDispute"></div>
    <div class="explain">
      ${validOnsetResults.length > 0 ? `
        The rainy season onset was detected in <strong>${onsetStats.yearsWithValidOnset}</strong>
        of the <strong>${onsetStats.yearsTotal}</strong> years in this range. On average it arrived
        around <strong>${meanOnsetLabel}</strong>, with a year-to-year spread (standard deviation) of
        about <strong>${onsetStats.stdDev} days</strong>. It ranged from as early as
        <strong>${earliestOnset.onsetDate}</strong> to as late as
        <strong>${latestOnset.onsetDate}</strong>.
        ${describeTrend(onsetTrend, { label: "the rainy-season onset date", unit: "days", digits: 2, upPhrase: "trend towards later onset", downPhrase: "trend towards earlier onset" })}
      ` : `No reliable rainy season onset could be detected in this year range from this dataset.`}
    </div>
    ${sensBlock(onsetSensText)}
    ${insufficientNote ? `<div class="explain">${insufficientNote}</div>` : ""}`;

  let advancedSummary = `
    <table class="advanced-table">
      <tr><th>Metric</th><th>Rainfall</th><th>Temperature</th></tr>
      <tr><td>Years used (n)</td><td>${rainTrend.n}</td><td>${tempTrend.n}</td></tr>
      <tr><td>Trend (Mann-Kendall, 5% level)</td><td>${verdictLabel(rainTrend)}</td><td>${verdictLabel(tempTrend)}</td></tr>
      <tr><td>Mann-Kendall Z, p-value</td><td>${mkText(rainTrend)}</td><td>${mkText(tempTrend)}</td></tr>
      <tr><td>Sen's slope (95% range)</td><td>${senText(rainTrend, 1, "mm/year")}</td><td>${senText(tempTrend, 3, "°C/year")}</td></tr>
      <tr><td>Linear regression slope, R² (comparison only)</td><td>${regRain.slope} mm/year, R² ${regRain.r2 === null ? "n/a" : regRain.r2}</td><td>${regTemp.slope} °C/year, R² ${regTemp.r2 === null ? "n/a" : regTemp.r2}</td></tr>
      <tr><td>Unusual years (flagged, not removed)</td><td>${flaggedList(rainSens)}</td><td>${flaggedList(tempSens)}</td></tr>
      <tr><td>Trend verdict without the unusual years</td><td>${withoutVerdict(rainSens)}</td><td>${withoutVerdict(tempSens)}</td></tr>
      <tr><td>Wettest / Hottest year</td><td>${wettestYear.year} (${wettestYear.total}mm)</td><td>${hottestYear.year} (${hottestYear.mean}°C)</td></tr>
      <tr><td>Driest / Coolest year</td><td>${driestYear.year} (${driestYear.total}mm)</td><td>${coldestYear.year} (${coldestYear.mean}°C)</td></tr>
    </table>
    <table class="advanced-table" style="margin-top:10px;">
      <tr><th colspan="2">Rainy Season Onset (Sivakumar 1988 criterion: from 1 May, at least 20 mm in 3 consecutive days, no dry spell longer than 7 days in the following 30 days; dry day = under 1 mm)</th></tr>
      <tr><td>Years with detected onset</td><td>${onsetStats.yearsWithValidOnset} / ${onsetStats.yearsTotal}${onsetStats.noOnsetYears.length ? ` (no onset: ${onsetStats.noOnsetYears.join(', ')})` : ''}${onsetStats.insufficientYears.length ? ` (insufficient data: ${onsetStats.insufficientYears.join(', ')})` : ''}</td></tr>
      <tr><td>Mean onset</td><td>${meanOnsetLabel}${onsetStats.yearsWithValidOnset > 0 ? ` (day ${onsetStats.mean}), standard deviation ${onsetStats.stdDev} days` : ''}</td></tr>
      <tr><td>Onset trend (Mann-Kendall, 5% level)</td><td>${verdictLabel(onsetTrend)}${onsetTrend.p !== null && onsetTrend.verdict !== "too_few" ? `, ${mkText(onsetTrend)}` : ''}</td></tr>
      <tr><td>Sen's slope (95% range)</td><td>${senText(onsetTrend, 2, "days/year")} (positive = later)</td></tr>
      <tr><td>Unusual onset years (flagged, not removed)</td><td>${flaggedList(onsetSens)}${onsetSens.without ? ` (trend without them: ${withoutVerdict(onsetSens)})` : ''}</td></tr>
      <tr><td>Earliest / Latest onset</td><td>${earliestOnset ? earliestOnset.onsetDate : 'n/a'} / ${latestOnset ? latestOnset.onsetDate : 'n/a'}</td></tr>
    </table>`;

  resultsDiv.innerHTML = `
    <div id="crossCheckBanner"></div>
    ${completenessCard}
    ${dataNoteCard}
    ${secondSourceCard}
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Summary (${currentTier} view)</div>
      ${currentTier === 'student' ? studentSummary : advancedSummary}
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Annual Rainfall (mm)</div>
      <canvas id="rainChartCanvas" height="80"></canvas>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Annual Mean Temperature (°C)</div>
      <canvas id="tempChartCanvas" height="80"></canvas>
    </div>
    <div class="card">
      <div class="card-label">Rainy Season Onset (day of year, gaps = no detected onset)</div>
      <canvas id="onsetChartCanvas" height="80"></canvas>
    </div>
  `;

  if (rainChart) rainChart.destroy();
  if (tempChart) tempChart.destroy();
  if (onsetChart) onsetChart.destroy();

  const rainCtx = document.getElementById("rainChartCanvas").getContext("2d");
  rainChart = new Chart(rainCtx, {
    type: 'bar',
    data: {
      labels: annualRain.map(y => y.year),
      datasets: [{
        label: 'Annual rainfall (mm)',
        data: annualRain.map(y => y.total),
        backgroundColor: '#00d4ff'
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
      }
    }
  });

  const tempCtx = document.getElementById("tempChartCanvas").getContext("2d");
  tempChart = new Chart(tempCtx, {
    type: 'line',
    data: {
      labels: annualTemp.map(y => y.year),
      datasets: [{
        label: 'Mean temperature (°C)',
        data: annualTemp.map(y => y.mean),
        borderColor: '#f59e0b',
        backgroundColor: 'rgba(245,158,11,0.1)',
        tension: 0.2
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
      }
    }
  });

  const onsetCtx = document.getElementById("onsetChartCanvas").getContext("2d");
  onsetChart = new Chart(onsetCtx, {
    type: 'scatter',
    data: {
      datasets: [{
        label: 'Onset (day of year)',
        data: onsetResults
          .filter(r => r.onsetDayOfYear !== null)
          .map(r => ({ x: r.year, y: r.onsetDayOfYear })),
        backgroundColor: '#22c55e',
        pointRadius: 5
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const match = onsetResults.find(r => r.year === ctx.parsed.x);
              return match ? `${match.year}: onset ${match.onsetDate} (day ${match.onsetDayOfYear})` : '';
            }
          }
        }
      },
      scales: {
        x: { title: { display: true, text: 'Year', color: '#9ca3af' }, ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
        y: {
          title: { display: true, text: 'Onset date', color: '#9ca3af' },
          ticks: {
            color: '#9ca3af',
            callback: (value) => {
              const iso = dayOfYearToDateString(2021, Math.round(value)); // 2021: non-leap reference year, used only to convert day-of-year to a month/day label
              const d = new Date(iso + 'T00:00:00Z');
              return d.toLocaleString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
            }
          },
          grid: { color: '#374151' }
        }
      }
    }
  });

  bindComparison();
}

async function compareSources(force = false) {
  const st = historicalState;
  const box = document.getElementById("compareResult");
  if (!st || !box) return;
  box.innerHTML = '<div class="status">Checking against ERA5 (Open-Meteo)...</div>';
  try {
    const got = await getJsonCached(buildArchiveUrl(st.lat, st.lon, st.startY, st.endY), {
      cache: dataCache, maxAgeMs: DEFAULT_MAX_AGE_MS, force,
      fetchJson: (u) => fetchJsonWithRetry(u, {
        label: "Open-Meteo (ERA5)", timeoutMs: 45000,
        onRetry: (n) => { box.innerHTML = `<div class="status">Open-Meteo did not answer properly. Trying again (${n} of 2)...</div>`; }
      }),
      validate: (d) => { const p = parseArchiveResponse(d); if (!p.ok) throw new Error(p.error); }
    });
    if (historicalState !== st) return;                     // the user loaded something else while we waited
    const parsed = parseArchiveResponse(got.data);
    const eraRainSel = selectCompleteYears(aggregateAnnualRainfall(parsed.rain), st.startY, st.endY);
    const eraTempSel = selectCompleteYears(aggregateAnnualMeanTemp(parsed.temp), st.startY, st.endY);
    st.comparison = {
      retrievedAt: new Date(got.savedAt), fromCache: got.fromCache, eraRainSel, eraTempSel,
      rainCmp: buildComparison(st.rainSel.eligible.map(y => ({ year: y.year, value: y.total })), eraRainSel.eligible.map(y => ({ year: y.year, value: y.total }))),
      tempCmp: buildComparison(st.tempSel.eligible.map(y => ({ year: y.year, value: y.mean })), eraTempSel.eligible.map(y => ({ year: y.year, value: y.mean })))
    };
    showComparison();
    updateCrossCheckBanner();
    try { applyComparisonOverlay(); } catch (overlayError) { /* the chart overlay is optional: the comparison text stays */ }
  } catch (err) {
    if (historicalState !== st) return;
    st.comparison = null;
    updateCrossCheckBanner();
    box.innerHTML = `<div class="error">Could not run the second-source check: ${escapeHtml(String(err.message).replace(/\.$/, ""))}.<br>
      Your NASA POWER results are not affected, but they have not been cross-checked. Use the button to try again.</div>`;
  }
}

function updateCrossCheckBanner() {
  const el = document.getElementById("crossCheckBanner");
  if (!el) return;
  const c = historicalState && historicalState.comparison;
  const parts = [];
  const plural = (n) => `${n} year${n === 1 ? "" : "s"}`;
  if (c && c.rainCmp.verdict === "diverge") parts.push(`rainfall: NASA POWER and ERA5 disagree strongly in ${plural(c.rainCmp.flagged.length)} (${c.rainCmp.flagged.join(", ")})`);
  if (c && c.tempCmp.verdict === "diverge") parts.push(`temperature: NASA POWER and ERA5 disagree strongly in ${plural(c.tempCmp.flagged.length)} (${c.tempCmp.flagged.join(", ")})`);
  const names = { nameA: "NASA POWER", nameB: "ERA5" };
  const note = (id, cmp, label) => {
    const target = document.getElementById(id);
    const text = c ? describeDispute(cmp, { label, ...names }) : "";
    if (target) target.innerHTML = text ? `<div class="explain" style="border-left-color:#f5a623;"><strong>${escapeHtml(text)}</strong></div>` : "";
  };
  note("rainDispute", c && c.rainCmp, "annual rainfall");
  note("tempDispute", c && c.tempCmp, "annual mean temperature");
  el.innerHTML = parts.length ? `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">Warning: second-source check</div>
      <div class="explain" style="border-left-color:#f5a623;">${escapeHtml(parts.join("; "))}.
        Results below that depend on those years, especially trends, should not be relied on yet.</div>
    </div>` : "";
}

function showComparison() {
  const st = historicalState, box = document.getElementById("compareResult");
  if (!st || !st.comparison || !box) return;
  const c = st.comparison;
  const namesA = { nameA: "NASA POWER", nameB: "ERA5" };
  const rainText = describeComparison(c.rainCmp, { label: "annual rainfall", unit: "mm", digits: 1, ...namesA });
  const tempText = describeComparison(c.tempCmp, { label: "annual mean temperature", unit: "°C", digits: 2, ...namesA });
  const warn = (cmp) => cmp.verdict === "diverge" ? ' style="border-left-color:#f5a623;"' : "";
  const table = currentTier === "student" ? "" : `
    <table class="advanced-table" style="margin-top:10px;">
      <tr><th>Year</th><th>NASA POWER (mm)</th><th>ERA5 (mm)</th><th>Difference</th></tr>
      ${c.rainCmp.rows.map(r => `<tr><td>${r.year}${c.rainCmp.flagged.includes(r.year) ? " ⚠" : ""}</td><td>${r.a.toFixed(1)}</td><td>${r.b.toFixed(1)}</td><td>${r.diff >= 0 ? "+" : ""}${r.diff.toFixed(1)}</td></tr>`).join("")}
    </table>`;
  box.innerHTML = `
    <div class="explain"${warn(c.rainCmp)}>${escapeHtml(rainText)}</div>
    <div class="explain"${warn(c.tempCmp)}>${escapeHtml(tempText)}</div>
    ${table}
    <div class="explain" style="margin-top:8px;">
      ${DATA_SOURCES.era5_open_meteo.name} retrieved ${c.retrievedAt.toLocaleString()}${c.fromCache ? `, saved copy ${describeAge(Date.now() - c.retrievedAt.getTime())} old` : ""}. ${DATA_SOURCES.era5_open_meteo.typeLabel}.
      Years used: rainfall ${c.eraRainSel.eligible.length} of ${c.eraRainSel.eligible.length + c.eraRainSel.excluded.length},
      temperature ${c.eraTempSel.eligible.length} of ${c.eraTempSel.eligible.length + c.eraTempSel.excluded.length}.
    </div>`;
}

function applyComparisonOverlay() {
  const st = historicalState;
  if (!st || !st.comparison) return;
  const c = st.comparison;
  const overlay = (chart, labelsYears, eraPoints, valueKey, unitLabel) => {
    if (!chart) return;
    const byYear = new Map(eraPoints.map(p => [p.year, p[valueKey]]));
    chart.data.datasets[0].label = "NASA POWER";
    chart.data.datasets.push({
      type: "line", label: "ERA5 (Open-Meteo)", data: labelsYears.map(y => byYear.has(y) ? byYear.get(y) : null),
      borderColor: "#f5a623", backgroundColor: "#f5a623", pointRadius: 3, borderWidth: 2, tension: 0, spanGaps: false
    });
    chart.options.plugins = chart.options.plugins || {};
    chart.options.plugins.legend = { display: true, labels: { color: "#9ca3af" } };
    chart.update();
  };
  overlay(rainChart, st.rainSel.eligible.map(y => y.year), c.eraRainSel.eligible, "total");
  overlay(tempChart, st.tempSel.eligible.map(y => y.year), c.eraTempSel.eligible, "mean");
}

function bindComparison() {
  const btn = document.getElementById("compareBtn");
  if (btn) btn.addEventListener("click", () => compareSources(true));
  const refresh = document.getElementById("refreshBtn");
  if (refresh) refresh.addEventListener("click", () => loadHistorical(true));
  const st = historicalState;
  if (st && st.comparison) { showComparison(); applyComparisonOverlay(); updateCrossCheckBanner(); }
  else if (st && !st.compareAttempted) { st.compareAttempted = true; compareSources(st.forceCompare === true); }   // runs by itself, once
}

document.getElementById("loadHistoricalBtn").addEventListener("click", () => loadHistorical(false));

document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const mode = btn.dataset.mode;
    document.getElementById("content").style.display = mode === "live" ? "block" : "none";
    document.getElementById("historical-content").style.display = mode === "historical" ? "block" : "none";
  });
});

// Initial load — Katsina
loadWeather(12.9908, 7.6018);
