<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Meteorology — Katsina Weather Intelligence</title>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --card: #1f2937;
    --cyan: #00d4ff;
    --amber: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #f9fafb;
    --text-dim: #9ca3af;
    --border: #374151;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .title span { color: var(--cyan); }
  .location-select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .tier-toggle {
    display: flex;
    gap: 6px;
    background: var(--panel);
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .tier-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.15s;
  }
  .tier-btn.active {
    background: var(--cyan);
    color: #0a0e17;
  }
  .status {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
  }
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card-label {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .card-value {
    font-size: 2rem;
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }
  .card-sub {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 6px;
  }
  .explain {
    background: rgba(0,212,255,0.08);
    border-left: 3px solid var(--cyan);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .forecast-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .day-card {
    background: var(--card);
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
    font-size: 0.75rem;
  }
  .day-card .day-name { color: var(--text-dim); margin-bottom: 6px; }
  .day-card .day-temp { font-weight: 700; font-family: 'Courier New', monospace; }
  .day-card .day-rain { color: var(--cyan); margin-top: 4px; }
  .advanced-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    font-family: 'Courier New', monospace;
  }
  .advanced-table th, .advanced-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .advanced-table th { color: var(--text-dim); font-weight: 600; }
  .footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--cyan); text-decoration: none; }
</style>
</head>

<div class="header">

      </label>

    </div>
  </div>
  <div id="historical-results"><div class="status">Choose a year range and click "Load Data"</div></div>
</div>

<div class="footer">
  Live data: <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> (free, no API key required, CC BY 4.0). Values are model-derived estimates, not station observations

</div>

<script>
// ===== knowledge_layer.js (inlined by build.js: edit the module file, not this copy) =====
// Meteorological Knowledge Layer — structured variable definitions,
// separated from rendering so any tier/future feature can pull from
// one source of truth instead of hardcoded strings scattered in the UI.

const KNOWLEDGE_BASE = {
  temperature: {
    name: "Air Temperature",
    unit: "°C",
    definition: "The measure of how hot or cold the air is, based on the average energy of air molecules.",
    standardHeight: "2 meters above ground",
    instrument: "Thermometer / thermistor",
    studentExplanation: "Measured at head height in a shaded, ventilated shelter so sunlight doesn't heat the sensor directly.",
    advancedNote: "WMO standard observation height: 1.25-2.0m AGL (WMO-No. 8 guide)."
  },
  apparentTemperature: {
    name: "Apparent Temperature (Feels Like)",
    unit: "°C",
    definition: "An estimate of how the temperature actually feels to the human body, accounting for humidity and wind.",
    studentExplanation: "Feels like accounts for humidity and wind, so it can feel different from the actual air temperature.",
    advancedNote: "Computed via a heat index or wind chill model depending on conditions."
  },
  humidity: {
    name: "Relative Humidity",
    unit: "%",
    definition: "The amount of water vapor in the air, as a percentage of the maximum the air could hold at that temperature.",
    studentExplanation: "Above 60% in Katsina's heat means sweat evaporates slower, so it feels hotter than the number alone suggests.",
    advancedNote: "RH = (actual vapor pressure / saturation vapor pressure) x 100."
  },
  windSpeed: {
    name: "Wind Speed",
    unit: "km/h",
    standardHeight: "10 meters above ground",
    definition: "The speed at which air is moving horizontally.",
    studentExplanation: "Measured 10 meters above ground — the international standard height for comparing wind readings anywhere in the world.",
    advancedNote: "WMO standard anemometer height: 10m AGL over open terrain."
  },
  precipitation: {
    name: "Precipitation",
    unit: "mm",
    definition: "The depth of liquid water that would accumulate on a flat surface from rain, in millimeters.",
    studentExplanation: "1mm of rain = 1 liter of water per square meter of ground.",
    advancedNote: "Measured via tipping-bucket or weighing rain gauge; 1mm = 1 L/m²."
  },
  pressure: {
    name: "Surface Pressure",
    unit: "hPa",
    definition: "Atmospheric pressure at the station's elevation.",
    studentExplanation: "Falling pressure often signals an approaching weather change.",
    advancedNote: "Station-level pressure shown here, not reduced to sea level (not QNH)."
  }
};

function getExplanation(key, tier) {
  const entry = KNOWLEDGE_BASE[key];
  if (!entry) return "";
  if (tier === "student") {
    return entry.studentExplanation || entry.definition || "";
  }
  return entry.advancedNote || entry.definition || "";
}

function getVariableInfo(key) {
  return KNOWLEDGE_BASE[key] || null;
}

if (typeof module !== "undefined") {
  module.exports = { KNOWLEDGE_BASE, getExplanation, getVariableInfo };
}
</script>
<script>
// ===== climate_math.js (inlined by build.js: edit the module file, not this copy) =====
// Pure functions for the historical climate layer — no network, testable in isolation

function parseNasaPowerSeries(paramObject) {
  // paramObject looks like: {"20200101": 25.3, "20200102": 26.1, ...}
  return Object.entries(paramObject).map(([dateStr, value]) => ({
    date: dateStr,
    year: parseInt(dateStr.substring(0, 4)),
    value: value
  })).filter(d => typeof d.value === 'number' && Number.isFinite(d.value) && d.value !== -999);
  // NASA POWER uses -999 for missing data. Missing days are REMOVED, never turned into zeros:
  // downstream code counts how many valid days each year really has.
}

const DEFAULT_MIN_COVERAGE = 0.95; // project choice (not a WMO standard): a year needs >= 95% valid days

function daysInYear(year) {
  return ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) ? 366 : 365;
}

function aggregateAnnualRainfall(dailyPrecip) {
  // dailyPrecip: array of {year, value} — sums to annual totals
  // Output: [{year, total (mm, sum of VALID days only), validDays}]
  const byYear = {};
  for (const d of dailyPrecip) {
    if (!byYear[d.year]) byYear[d.year] = { sum: 0, count: 0 };
    byYear[d.year].sum += d.value;
    byYear[d.year].count += 1;
  }
  return Object.entries(byYear)
    .map(([year, agg]) => ({ year: parseInt(year), total: Math.round(agg.sum * 10) / 10, validDays: agg.count }))
    .sort((a, b) => a.year - b.year);
}

function aggregateAnnualMeanTemp(dailyTemp) {
  const byYear = {};
  for (const d of dailyTemp) {
    if (!byYear[d.year]) byYear[d.year] = { sum: 0, count: 0 };
    byYear[d.year].sum += d.value;
    byYear[d.year].count += 1;
  }
  return Object.entries(byYear)
    .map(([year, agg]) => ({ year: parseInt(year), mean: Math.round((agg.sum / agg.count) * 10) / 10, validDays: agg.count }))
    .sort((a, b) => a.year - b.year);
}

function selectCompleteYears(annualData, startYear, endYear, minCoverage = DEFAULT_MIN_COVERAGE) {
  // Keeps only years with enough valid days (validDays / days in that year >= minCoverage).
  // Every year from startYear to endYear is accounted for: a year with no data at all is
  // reported as excluded with 0% coverage, never silently skipped.
  // Returns { eligible: [item + expectedDays + coverage], excluded: [{year, validDays, expectedDays, coverage}], minCoverage }
  const byYear = {};
  for (const item of annualData) byYear[item.year] = item;
  const eligible = [], excluded = [];
  for (let year = startYear; year <= endYear; year++) {
    const expectedDays = daysInYear(year);
    const item = byYear[year];
    const validDays = item ? item.validDays : 0;
    const coverage = Math.round((validDays / expectedDays) * 1000) / 1000;
    if (item && coverage >= minCoverage) eligible.push({ ...item, expectedDays, coverage });
    else excluded.push({ year, validDays, expectedDays, coverage });
  }
  return { eligible, excluded, minCoverage };
}

function linearRegression(points) {
  // points: array of {year, value} (value = total or mean, whichever series)
  const n = points.length;
  if (n < 2) return { slope: 0, intercept: 0, r2: null };

  const xs = points.map(p => p.year);
  const ys = points.map(p => p.value);
  const meanX = xs.reduce((a, b) => a + b, 0) / n;
  const meanY = ys.reduce((a, b) => a + b, 0) / n;

  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - meanX) * (ys[i] - meanY);
    den += (xs[i] - meanX) ** 2;
  }
  const slope = den === 0 ? 0 : num / den;
  const intercept = meanY - slope * meanX;

  // R-squared
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const predicted = slope * xs[i] + intercept;
    ssRes += (ys[i] - predicted) ** 2;
    ssTot += (ys[i] - meanY) ** 2;
  }
  // R² is not meaningful with fewer than 3 points (2 points always fit a line perfectly)
  const r2 = n < 3 ? null : (ssTot === 0 ? 0 : 1 - (ssRes / ssTot));

  return { slope: Math.round(slope * 1000) / 1000, intercept: Math.round(intercept * 100) / 100, r2: r2 === null ? null : Math.round(r2 * 1000) / 1000 };
}

function findExtremeYear(yearlyData, valueKey, mode) {
  // mode: 'max' or 'min'. Returns null for an empty list (never throws).
  if (!yearlyData || yearlyData.length === 0) return null;
  return yearlyData.reduce((best, current) => {
    if (mode === 'max') return current[valueKey] > best[valueKey] ? current : best;
    return current[valueKey] < best[valueKey] ? current : best;
  });
}

if (typeof module !== "undefined") module.exports = {
  DEFAULT_MIN_COVERAGE,
  daysInYear,
  selectCompleteYears,
  parseNasaPowerSeries,
  aggregateAnnualRainfall,
  aggregateAnnualMeanTemp,
  linearRegression,
  findExtremeYear
};
</script>
<script>
// ===== trend_stats.js (inlined by build.js: edit the module file, not this copy) =====
// Trend statistics for annual series: Mann-Kendall test and Sen's slope.
// Pure functions — no network, testable in isolation. See docs/trend-method.md.
//
// Why these and not just a regression line: annual rainfall is skewed and has outliers;
// Mann-Kendall (rank based) and Sen's slope (median of pairwise slopes) are the standard
// robust choices in climatology, and Mann-Kendall gives an honest p-value.

const TREND_ALPHA = 0.05;          // 5% significance level (convention)
const MIN_YEARS_FOR_TREND = 10;    // below this the normal approximation is not reliable
const Z_95 = 1.959963984540054;    // standard normal quantile for a 95% interval

function erfc(x) {
  // Complementary error function, accurate to about 1e-12 (series for small |x|, continued fraction for large).
  if (x < 0) return 2 - erfc(-x);
  if (x < 3) {
    let term = x, sum = x;
    for (let n = 1; n < 200; n++) {
      term *= -x * x / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17) break;
    }
    return 1 - (2 / Math.sqrt(Math.PI)) * sum;
  }
  let t = x;
  for (let k = 80; k >= 1; k--) t = x + (k / 2) / t;
  return Math.exp(-x * x) / (Math.sqrt(Math.PI) * t);
}

function normalCDF(z) {
  return 0.5 * erfc(-z / Math.SQRT2);
}

function tieTerm(values) {
  // Sum over groups of tied values: t(t-1)(2t+5)
  const counts = new Map();
  for (const v of values) counts.set(v, (counts.get(v) || 0) + 1);
  let sum = 0;
  for (const t of counts.values()) if (t > 1) sum += t * (t - 1) * (2 * t + 5);
  return sum;
}

function mannKendall(values) {
  // values: numbers in time order. Returns the Mann-Kendall statistic S, its tie-corrected variance,
  // the normal score Z (with continuity correction) and the two-sided p-value.
  const n = values.length;
  let s = 0;
  for (let i = 0; i < n - 1; i++) {
    for (let j = i + 1; j < n; j++) s += Math.sign(values[j] - values[i]);
  }
  const varS = (n * (n - 1) * (2 * n + 5) - tieTerm(values)) / 18;
  let z = 0;
  if (varS > 0) {
    if (s > 0) z = (s - 1) / Math.sqrt(varS);
    else if (s < 0) z = (s + 1) / Math.sqrt(varS);
  }
  const p = 2 * (1 - normalCDF(Math.abs(z)));
  const tau = n > 1 ? s / (0.5 * n * (n - 1)) : 0;
  return { n, s, varS, z, p, tau };
}

function roundHalfEven(x) {
  const f = Math.floor(x), diff = x - f;
  if (diff < 0.5) return f;
  if (diff > 0.5) return f + 1;
  return f % 2 === 0 ? f : f + 1;
}

function median(sorted) {
  const m = sorted.length;
  if (m === 0) return NaN;
  return m % 2 ? sorted[(m - 1) / 2] : (sorted[m / 2 - 1] + sorted[m / 2]) / 2;
}

function senSlope(xs, ys) {
  // Sen's slope: the median of all pairwise slopes, with a 95% confidence interval
  // from Sen (1968), using the same rank rule as scipy.stats.theilslopes.
  const slopes = [];
  for (let i = 0; i < xs.length - 1; i++) {
    for (let j = i + 1; j < xs.length; j++) {
      if (xs[j] !== xs[i]) slopes.push((ys[j] - ys[i]) / (xs[j] - xs[i]));
    }
  }
  slopes.sort((a, b) => a - b);
  const nt = slopes.length;
  const slope = median(slopes);
  const sigma = Math.sqrt(((ys.length * (ys.length - 1) * (2 * ys.length + 5)) - tieTerm(ys)) / 18);
  const ru = Math.min(roundHalfEven((nt + Z_95 * sigma) / 2), nt - 1);
  const rl = Math.max(roundHalfEven((nt - Z_95 * sigma) / 2) - 1, 0);
  return { slope, low: slopes[rl], high: slopes[ru], pairs: nt };
}

function analyzeTrend(points, alpha = TREND_ALPHA, minYears = MIN_YEARS_FOR_TREND) {
  // points: [{year, value}] in any order. Never claims a trend without enough years or a significant test.
  const sorted = [...points].sort((a, b) => a.year - b.year);
  const n = sorted.length;
  const base = { n, firstYear: n ? sorted[0].year : null, lastYear: n ? sorted[n - 1].year : null, alpha, minYears };
  if (n < 3) return { ...base, verdict: 'too_few', s: null, z: null, p: null, tau: null, slope: null, slopeLow: null, slopeHigh: null };
  const mk = mannKendall(sorted.map(d => d.value));
  const sen = senSlope(sorted.map(d => d.year), sorted.map(d => d.value));
  let verdict;
  if (n < minYears) verdict = 'too_few';
  else if (mk.p < alpha) verdict = mk.s > 0 ? 'increasing' : 'decreasing';
  else verdict = 'none';
  return { ...base, verdict, s: mk.s, z: mk.z, p: mk.p, tau: mk.tau, slope: sen.slope, slopeLow: sen.low, slopeHigh: sen.high };
}

function formatPValue(p) {
  return p < 0.001 ? "p < 0.001" : "p = " + p.toFixed(3);
}

function signedNumber(v, digits) {
  const text = v.toFixed(digits);
  return (v > 0 ? "+" : "") + text;
}

function describeTrend(t, opts = {}) {
  // Plain-English sentence for a result of analyzeTrend. The wording only ever claims a trend
  // when the test says it is statistically significant and there are enough years.
  const { label = "the series", unit = "", digits = 2,
          upPhrase = "increasing trend", downPhrase = "decreasing trend" } = opts;
  const span = `${t.firstYear}–${t.lastYear}`;
  const capLabel = label.charAt(0).toUpperCase() + label.slice(1);
  if (t.verdict === 'too_few') {
    return `Only ${t.n} usable year${t.n === 1 ? "" : "s"}: too few (at least ${t.minYears} are needed) to test for a trend in ${label}.`;
  }
  const estimate = `${signedNumber(t.slope, digits)} ${unit} per year (95% range ${signedNumber(t.slopeLow, digits)} to ${signedNumber(t.slopeHigh, digits)})`;
  if (t.verdict === 'none') {
    return `No statistically detectable trend in ${label} over ${span} (Mann-Kendall test, ${formatPValue(t.p)}). The best estimate is ${estimate}, which cannot be told apart from natural year-to-year variation.`;
  }
  const phrase = t.verdict === 'increasing' ? upPhrase : downPhrase;
  return `${capLabel} shows a statistically significant ${phrase} over ${span} (Mann-Kendall test, ${formatPValue(t.p)}): about ${estimate}. This describes this dataset at this location; it does not by itself explain the cause.`;
}

function quantile(values, q) {
  // Linear interpolation between ranks (same as numpy.percentile's default).
  const sorted = [...values].sort((a, b) => a - b);
  const pos = (sorted.length - 1) * q;
  const lower = Math.floor(pos), upper = Math.ceil(pos);
  return sorted[lower] + (sorted[upper] - sorted[lower]) * (pos - lower);
}

function flagUnusualYears(points, k = 1.5, minYears = MIN_YEARS_FOR_TREND) {
  // Tukey fences: a year is "unusual" if its value is more than k * IQR beyond the quartiles.
  // Unusual years are FLAGGED for checking, never removed from the data: they may be real extremes.
  if (points.length < minYears) return { flagged: [], lowerFence: null, upperFence: null, q1: null, q3: null };
  const values = points.map(p => p.value);
  const q1 = quantile(values, 0.25), q3 = quantile(values, 0.75), iqr = q3 - q1;
  const lowerFence = q1 - k * iqr, upperFence = q3 + k * iqr;
  const flagged = points.filter(p => p.value < lowerFence || p.value > upperFence)
                        .sort((a, b) => a.year - b.year);
  return { flagged, lowerFence, upperFence, q1, q3 };
}

function trendSensitivity(points) {
  // Does the trend verdict depend on the unusual years? Re-runs the test without them.
  const withAll = analyzeTrend(points);
  const { flagged } = flagUnusualYears(points);
  if (flagged.length === 0) return { flagged, withAll, without: null, changed: false };
  const flaggedYears = new Set(flagged.map(f => f.year));
  const without = analyzeTrend(points.filter(p => !flaggedYears.has(p.year)));
  return { flagged, withAll, without, changed: without.verdict !== withAll.verdict };
}

function describeSensitivity(sens, opts = {}) {
  // Empty string when nothing is unusual. Otherwise a plain sentence, with a warning if the verdict changes.
  if (sens.flagged.length === 0) return "";
  const { unit = "", digits = 1, upPhrase = "increasing trend", downPhrase = "decreasing trend" } = opts;
  const list = sens.flagged.map(f => `${f.year} (${f.value.toFixed(digits)} ${unit})`.replace(" )", ")")).join(", ");
  const head = `Unusual years flagged for checking (not removed): ${list}.`;
  if (!sens.changed) return `${head} Leaving them out does not change the trend result.`;

  const pText = w.p === null ? "" : ` (Mann-Kendall test, ${formatPValue(w.p)})`;
  return `${head} The trend result depends on them: without these ${sens.flagged.length} years it is ${words[w.verdict]}${pText}. A few extreme years can come from a problem in the data, so check this series against another source before relying on it.`;
}

<script>
// ===== cache_store.js (inlined by build.js: edit the module file, not this copy) =====
// A small on-device cache for downloaded data (localStorage when the browser allows it, memory otherwise).
// Pure logic with an injected storage object, so it can be tested without a browser. See docs/data-sources.md.

const CACHE_PREFIX = "om-cache:";
const DEFAULT_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;   // historical data changes rarely: keep a saved copy for 7 days

function describeAge(ms) {
  if (ms < 60 * 1000) return "just now";
  const minutes = Math.floor(ms / 60000);
  if (minutes < 60) return `${minutes} minute${minutes === 1 ? "" : "s"}`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"}`;
  const days = Math.floor(hours / 24);
  return `${days} day${days === 1 ? "" : "s"}`;
}

function createCache(storage, options = {}) {
  const { now = () => Date.now(), prefix = CACHE_PREFIX } = options;
  const memory = new Map();            // used when the browser blocks storage, or an entry cannot fit
  let storageWorks = !!storage;

  const safe = (fn, fallback) => { try { return fn(); } catch (e) { return fallback; } };
  const readRaw = (key) => {
    if (storageWorks) {
      const raw = safe(() => storage.getItem(prefix + key), undefined);
      if (raw === undefined) storageWorks = false;      // storage threw (for example blocked by the browser)
      else if (raw !== null) return raw;
    }
    return memory.has(key) ? memory.get(key) : null;
  };
  const removeKey = (key) => { memory.delete(key); if (storageWorks) safe(() => storage.removeItem(prefix + key)); };

  function listStoredKeys() {
    const keys = [];
    if (!storageWorks) return keys;
    const n = safe(() => storage.length, 0);
    for (let i = 0; i < n; i++) {
      const k = safe(() => storage.key(i), null);
      if (typeof k === "string" && k.startsWith(prefix)) keys.push(k.slice(prefix.length));
    }
    return keys;
  }

  function get(key, maxAgeMs = DEFAULT_MAX_AGE_MS) {
    const raw = readRaw(key);
    if (raw === null) return null;
    let entry;
    try { entry = JSON.parse(raw); } catch (e) { removeKey(key); return null; }
    if (!entry || typeof entry.savedAt !== "number" || !("data" in entry)) { removeKey(key); return null; }
    const ageMs = now() - entry.savedAt;
    if (ageMs < 0 || ageMs > maxAgeMs) { removeKey(key); return null; }   // expired, or the clock moved backwards
    return { data: entry.data, savedAt: entry.savedAt, ageMs };
  }

  function set(key, data) {
    const raw = JSON.stringify({ savedAt: now(), data });
    memory.delete(key);
    if (storageWorks) {
      for (let attempt = 0; attempt < 50; attempt++) {
        try { storage.setItem(prefix + key, raw); return { stored: "storage" }; } catch (e) { /* probably full */ }
        // Make room by removing the oldest saved entry, then try again
        const entries = listStoredKeys().filter(k => k !== key).map(k => {
          const parsed = safe(() => JSON.parse(storage.getItem(prefix + k)), null);
          return { k, savedAt: parsed && typeof parsed.savedAt === "number" ? parsed.savedAt : 0 };
        }).sort((a, b) => a.savedAt - b.savedAt);
        if (entries.length === 0) break;
        removeKey(entries[0].k);
      }
    }
    memory.set(key, raw);
    return { stored: "memory" };
  }

  function clear() {
    for (const k of listStoredKeys()) removeKey(k);
    memory.clear();
  }

  return { get, set, remove: removeKey, clear };
}

if (typeof module !== "undefined") module.exports = { CACHE_PREFIX, DEFAULT_MAX_AGE_MS, describeAge, createCache };

<script>
// ===== request_tools.js (inlined by build.js: edit the module file, not this copy) =====
// Reliable web requests: a time limit, a few retries for temporary problems, and messages a person can act on.
// Pure logic with injected fetch/sleep, so it can be tested without a network. See docs/data-sources.md.

class RequestError extends Error {
  constructor(message, retryable) {
    super(message);
    this.name = "RequestError";
    this.retryable = retryable;
  }
}

function describeHttpProblem(label, status) {
  if (status === 429) return new RequestError(`${label} says too many requests were made (status 429)`, true);
  if (status >= 500) return new RequestError(`${label} is having problems (status ${status})`, true);
  return new RequestError(`${label} rejected the request (status ${status})`, false);
}

async function attemptOnce(url, fetchFn, timeoutMs, label) {
  const controller = typeof AbortController === "function" ? new AbortController() : null;
  let timer;
  try {
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => {
        if (controller) controller.abort();
        reject(new RequestError(`${label} took longer than ${Math.max(1, Math.round(timeoutMs / 1000))} seconds to answer`, true));
      }, timeoutMs);
    });
    const pending = Promise.resolve(fetchFn(url, controller ? { signal: controller.signal } : undefined));
    pending.catch(() => {});             // a late failure after a timeout must not become an unhandled error
    const response = await Promise.race([pending, timeout]);
    if (!response.ok) throw describeHttpProblem(label, response.status);
    try { return await response.json(); }
    catch (e) { throw new RequestError(`${label} sent an answer that could not be read`, false); }
  } finally {
    clearTimeout(timer);
  }
}

async function fetchJsonWithRetry(url, options = {}) {
  const {
    fetchFn = (typeof fetch === "function" ? fetch : null),
    timeoutMs = 30000, retries = 2, backoffMs = 1000,
    sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms)),
    label = "the service", onRetry = null
  } = options;
  if (!fetchFn) throw new RequestError("This browser cannot make web requests.", false);
  let lastError;
  for (let attempt = 0; attempt <= retries; attempt++) {
    if (attempt > 0) {
      if (onRetry) onRetry(attempt, lastError);
      await sleep(backoffMs * 2 ** (attempt - 1));
    }
    try {
      return await attemptOnce(url, fetchFn, timeoutMs, label);
    } catch (e) {
      lastError = e instanceof RequestError ? e : new RequestError(`could not reach ${label} (check your internet connection)`, true);
      if (!lastError.retryable) throw lastError;
    }
  }
  throw lastError;
}

async function getJsonCached(url, options = {}) {
  // Uses a saved copy when it is fresh; otherwise downloads, checks the answer, and only then saves it.
  // `validate(data)` must throw if the answer is unusable: bad data is never saved.
  const { cache, fetchJson, maxAgeMs, force = false, validate = null, now = () => Date.now() } = options;
  if (!force && cache) {
    const hit = cache.get(url, maxAgeMs);
    if (hit) return { data: hit.data, savedAt: hit.savedAt, fromCache: true };
  }
  const data = await fetchJson(url);
  if (validate) validate(data);
  if (cache) cache.set(url, data);
  return { data, savedAt: now(), fromCache: false };
}

if (typeof module !== "undefined") module.exports = { RequestError, fetchJsonWithRetry, getJsonCached };

const ARCHIVE_BASE_URL = "https://archive-api.open-meteo.com/v1/archive";

function buildArchiveUrl(lat, lon, startYear, endYear) {
  const la = Number(lat), lo = Number(lon), sy = Number(startYear), ey = Number(endYear);
  if (!Number.isFinite(la) || la < -90 || la > 90) throw new Error("latitude must be a number between -90 and 90");

      if (typeof t !== "string" || !/^\d{4}-\d{2}-\d{2}/.test(t)) return null;

const LIVE_CURRENT_FIELDS = ["temperature_2m", "relative_humidity_2m", "apparent_temperature", "wind_speed_10m", "precipitation", "weather_code", "surface_pressure"];
const LIVE_DAILY_FIELDS = ["temperature_2m_max", "temperature_2m_min", "precipitation_sum", "weather_code", "wind_speed_10m_max", "uv_index_max"];

  // where every value is a number or null (never 0 for a missing value), or { ok: false, error }.
  if (!json || typeof json !== "object") return { ok: false, error: "The service returned something that is not data." };
  if (json.error) return { ok: false, error: json.reason ? `The service reported an error: ${json.reason}` : "The service reported an error." };
  if (!json.current || typeof json.current !== "object") return { ok: false, error: "The response has no current conditions." };
  if (!json.daily || !Array.isArray(json.daily.time)) return { ok: false, error: "The response has no daily forecast." };

  for (const f of LIVE_CURRENT_FIELDS) {
    current[f] = num(json.current[f]);

<script>
// ===== source_compare.js (inlined by build.js: edit the module file, not this copy) =====
// Comparing the same annual quantity from two data sources.
// Pure functions — no network, testable in isolation. Needs trend_stats.js loaded first.
// Method: line the series up by year, look at the year-by-year difference, and flag years where the
// difference is far outside the usual spread (Tukey fences at 3 x IQR). No fixed thresholds are invented:
// a year is flagged because it differs from how the two sources usually differ. The stricter 3 x IQR fence
// is used (not 1.5) because with 1.5 about 36% of comparisons between consistent sources would show a
// false disagreement (simulation, 35 years); with 3 about 1%.

const COMPARE_FENCE_K = 3;

function pearson(x, y) {
  const n = x.length;
  if (n < 3) return null;
  const mx = x.reduce((a, b) => a + b, 0) / n, my = y.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; }
  if (sxx === 0 || syy === 0) return null;
  return sxy / Math.sqrt(sxx * syy);
}

function ranks(values) {
  // Average ranks for ties (as scipy.stats.rankdata)
  const idx = values.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
  const out = new Array(values.length);
  let i = 0;
  while (i < idx.length) {
    let j = i;
    while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    const avg = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) out[idx[k][1]] = avg;
    i = j + 1;
  }
  return out;
}

function spearman(x, y) {
  if (x.length < 3) return null;
  return pearson(ranks(x), ranks(y));
}

function buildComparison(seriesA, seriesB, minYears = MIN_YEARS_FOR_TREND) {
  // seriesA, seriesB: [{year, value}]. Only years present in both are compared.
  const mapB = new Map(seriesB.map(p => [p.year, p.value]));
  const rows = seriesA.filter(p => mapB.has(p.year))
    .map(p => ({ year: p.year, a: p.value, b: mapB.get(p.year), diff: p.value - mapB.get(p.year) }))
    .sort((p, q) => p.year - q.year);
  const n = rows.length;
  const base = { n, rows, minYears };
  if (n < 3) return { ...base, verdict: "too_few", pearson: null, spearman: null, meanDiff: null, flagged: [], pearsonWithoutFlagged: null, trendA: null, trendB: null };
  const a = rows.map(r => r.a), b = rows.map(r => r.b);
  const meanDiff = rows.reduce((s, r) => s + r.diff, 0) / n;
  const flaggedYears = flagUnusualYears(rows.map(r => ({ year: r.year, value: r.diff })), COMPARE_FENCE_K, minYears).flagged.map(f => f.year);
  const rest = rows.filter(r => !flaggedYears.includes(r.year));
  const verdict = n < minYears ? "too_few" : (flaggedYears.length > 0 ? "diverge" : "agree");
  return {
    ...base, verdict, meanDiff,
    pearson: pearson(a, b), spearman: spearman(a, b),
    flagged: flaggedYears, pearsonWithoutFlagged: flaggedYears.length ? pearson(rest.map(r => r.a), rest.map(r => r.b)) : null,
    trendA: analyzeTrend(rows.map(r => ({ year: r.year, value: r.a }))),
    trendB: analyzeTrend(rows.map(r => ({ year: r.year, value: r.b })))
  };
}

function describeComparison(cmp, opts = {}) {
  const { label = "the series", unit = "", digits = 1, nameA = "Source A", nameB = "Source B" } = opts;
  if (cmp.verdict === "too_few") return `Only ${cmp.n} year${cmp.n === 1 ? "" : "s"} in common: too few (at least ${cmp.minYears} are needed) to compare the two sources for ${label}.`;
  const r = cmp.pearson === null ? "n/a" : cmp.pearson.toFixed(2);
  const rs = cmp.spearman === null ? "n/a" : cmp.spearman.toFixed(2);
  const higher = cmp.meanDiff >= 0 ? nameA : nameB;
  const bias = `On average ${higher} is ${Math.abs(cmp.meanDiff).toFixed(digits)} ${unit} higher per year.`;
  const stats = `Over ${cmp.n} common years the correlation is r = ${r} (Spearman ${rs}).`;
  const verdictText = (t) => ({ increasing: "a significant increasing trend", decreasing: "a significant decreasing trend", none: "no significant trend", too_few: "too few years to test" })[t.verdict];
  const trends = `Trend for ${label}: ${nameA} shows ${verdictText(cmp.trendA)}; ${nameB} shows ${verdictText(cmp.trendB)}.`;
  if (cmp.verdict === "agree") return `No year stands out: the year-to-year difference between the two sources is never unusually large. ${stats} ${bias} ${trends}`;
  const list = cmp.flagged.map(y => { const row = cmp.rows.find(q => q.year === y); return `${y} (${nameA} ${row.a.toFixed(digits)}, ${nameB} ${row.b.toFixed(digits)} ${unit})`; }).join("; ");
  const without = cmp.pearsonWithoutFlagged === null ? "" : ` Without those years r = ${cmp.pearsonWithoutFlagged.toFixed(2)}.`;
  return `The two sources disagree in ${cmp.flagged.length} year${cmp.flagged.length === 1 ? "" : "s"}, where the difference between them is unusually large: ${list}. ${stats}${without} ${bias} ${trends} This does not say which source is right; treat results that depend on those years with caution.`;
}

function describeDispute(cmp, opts = {}) {
  // A note to show under a headline trend when the second source tells a different story.
  // Empty when the sources agree or when there is nothing to compare.
  const { label = "the series", nameA = "Source A", nameB = "Source B" } = opts;
  if (!cmp || cmp.verdict !== "diverge" || !cmp.trendA || !cmp.trendB) return "";
  if (cmp.trendA.verdict === cmp.trendB.verdict) return "";
  const words = { increasing: "a significant increasing trend", decreasing: "a significant decreasing trend", none: "no significant trend", too_few: "too few years to test" };
  return `Disputed: ${nameB} shows ${words[cmp.trendB.verdict]} for the same years, and the two sources disagree strongly in ${cmp.flagged.join(", ")}. Do not rely on the ${label} trend above yet.`;
}

if (typeof module !== "undefined") {
  const t = require("./trend_stats.js");
  globalThis.MIN_YEARS_FOR_TREND = t.MIN_YEARS_FOR_TREND;
  globalThis.flagUnusualYears = t.flagUnusualYears;
  globalThis.analyzeTrend = t.analyzeTrend;
  module.exports = { COMPARE_FENCE_K, pearson, spearman, ranks, buildComparison, describeComparison, describeDispute };
}
</script>
